name: CI/CD — Deploy Frontend (diklat-fe-app)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/diklat-fe-app

jobs:
  # ──────────────────────────────────────────────────
  # JOB 1: Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inject public env vars as build args so Next.js bakes them at build time
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_TOKEN=${{ secrets.NEXT_PUBLIC_APP_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────
  # JOB 2: Deploy to VPS via SSH
  # ──────────────────────────────────────────────────
  deploy-to-vps:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/var/www/diklat-fe"

      - name: 🔌 SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: GHCR_PAT,GITHUB_TOKEN
          script: |
            set -e
            # ── Navigasi ke direktori frontend di VPS ──
            cd /var/www/diklat-fe

            # ── Autentikasi ke GHCR (Gunakan GHCR_PAT jika ada, atau fallback ke GITHUB_TOKEN) ──
            TOKEN="${GHCR_PAT:-$GITHUB_TOKEN}"
            if [ -n "$TOKEN" ]; then
              echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi

            # ── Pull image terbaru dari GHCR ──
            docker compose pull frontend

            # ── Jalankan ulang service ──
            docker compose up -d --remove-orphans

            # ── Bersihkan image lama ──
            docker image prune -f

            echo "✅ Frontend deployment selesai."
