services:
  # ─────────────────────────────────────────────
  # Service: Next.js Frontend Application
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/amar-group/diklat-fe-app:latest
    container_name: diklat-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Atur agar frontend memanggil backend via HTTPS Same-Origin
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://diklat-amar.id}
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    networks:
      - diklat-global-network

# ─────────────────────────────────────────────
# Network — JOIN network milik diklat-be-app
# ─────────────────────────────────────────────
networks:
  diklat-global-network:
    name: diklat-global-network
    external: true
